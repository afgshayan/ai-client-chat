name: Build debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a rolling "latest-debug-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug-build --yes --cleanup-tag || true
          gh release create latest-debug-build \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest debug build" \
            --notes "Automatically built from commit ${{ github.sha }} on branch ${{ github.ref_name }}. For testing only — not signed for release." \
            --target "${{ github.sha }}"
